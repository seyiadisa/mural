services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mural
      POSTGRES_USER: mural
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mural -d mural"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://mural:${POSTGRES_PASSWORD}@database:5432/mural
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://mural:${POSTGRES_PASSWORD}@database:5432/mural
      PUBLIC_ORIGIN: https://${API_DOMAIN:?Set the web app domain}
      MURAL_WEB_ORIGIN: https://${API_DOMAIN}
      MURAL_WEB_OWNER_EMAIL: ${MURAL_WEB_OWNER_EMAIL:?Set the owner Google email}
      MURAL_SECRETS_ENCRYPTION_KEY: ${MURAL_SECRETS_ENCRYPTION_KEY:?Set a 32-byte encryption key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set a Google web OAuth client ID}
      GOOGLE_IOS_CLIENT_IDS: ${GOOGLE_IOS_CLIENT_IDS:-}
      GOOGLE_ANDROID_SERVER_CLIENT_ID: ${GOOGLE_ANDROID_SERVER_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_IDS: ${GOOGLE_ANDROID_CLIENT_IDS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      ACCOUNTS_ENABLED: "true"
      ACCOUNTS_HMAC_KEY: ${ACCOUNTS_HMAC_KEY:?Set a random 32-byte hex secret}
      ACCOUNTS_PROXY_TOKEN: ${ACCOUNTS_PROXY_TOKEN:?Set a different random 32-byte hex secret}
      ACCOUNTS_ALLOW_LOCAL_LOOPBACK: "false"
      HOSTED_VOICE_EXPERIMENTAL: ${HOSTED_VOICE_EXPERIMENTAL:-true}
      HOSTED_VOICE_ACCESS: ${HOSTED_VOICE_ACCESS:-public-minutes}
      HOSTED_VOICE_BILLING_UNIT: ${HOSTED_VOICE_BILLING_UNIT:-milliseconds}
      HOSTED_VOICE_LIFETIME_CAP_NANO: "0"
      HOSTED_HELPERS_EXPERIMENTAL: "false"
      MURAL_LIVE_MODEL: ${MURAL_LIVE_MODEL:-gpt-live-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MURAL_MINUTE_STRIPE_QUANTITY_ENABLED: ${MURAL_MINUTE_STRIPE_QUANTITY_ENABLED:-false}
      MURAL_MINUTE_APPLE_QUANTITY_ENABLED: ${MURAL_MINUTE_APPLE_QUANTITY_ENABLED:-false}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_TEST_PRICE_10_USD: ${STRIPE_TEST_PRICE_10_USD:-}
      STRIPE_TEST_PRICE_25_USD: ${STRIPE_TEST_PRICE_25_USD:-}
      STRIPE_TEST_PAYMENT_FEE_10_MINOR: ${STRIPE_TEST_PAYMENT_FEE_10_MINOR:-}
      STRIPE_TEST_PAYMENT_FEE_25_MINOR: ${STRIPE_TEST_PAYMENT_FEE_25_MINOR:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    depends_on: [api]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACCOUNTS_PROXY_TOKEN: ${ACCOUNTS_PROXY_TOKEN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
